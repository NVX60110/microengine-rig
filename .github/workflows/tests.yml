name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile microengine_rig.py two_zone_model.py mechanism_gate.py burke2015_gate.py operability_sensitivity.py two_zone_temperature_stability.py leakage_scaling.py physics/annulus.py physics/thermal_clearance.py scripts/reduce_leakdown_experiment.py scripts/analyze_thermal_literature.py
      - run: python -m py_compile cfd/audit_cfd01.py cfd/audit_scalar_inventory.py cfd/compare_tracer_mixing.py cfd/openfoam14/cold_flow_tracer/scripts/postprocess_history.py cfd/openfoam14/cold_flow_tracer/scripts/collect_results.py cfd/openfoam14/cold_flow_tracer/scripts/run_cfd01.py cfd/openfoam14/cold_flow_tracer/scripts/run_timestep_sweep.py cfd/openfoam14/squish/run_squish_cfd.py cfd/openfoam14/squish/run_s2_cfd.py
      - run: python cfd/audit_cfd01.py > /tmp/cfd01_audit.json
